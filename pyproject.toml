[project]
name = "motet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
motet = "vexas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
